<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" data-default-icon />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" data-default-icon />
    <link rel="manifest" href="/site.webmanifest" data-default-manifest />
    <meta name="theme-color" content="#1f3fa3" data-default-theme />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Командировки" />
    <title>Планирование Командировок</title>
    <meta name="description" content="Система планирования и согласования командировок для медицинских представителей и менеджеров" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.hostname.includes("yandexcloud.net")) {
        document.querySelector("[data-default-icon]").setAttribute("href", "/favicon-yandex.png");
        document.querySelector("[data-default-icon][rel='apple-touch-icon']").setAttribute("href", "/apple-touch-icon-yandex.png");
        document.querySelector("[data-default-manifest]").setAttribute("href", "/site.webmanifest-yandex.json");
        document.querySelector("[data-default-theme]").setAttribute("content", "#10069f");
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
